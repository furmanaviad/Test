<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Print Cards</title>
  <meta name="theme-color" content="#d6336c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Timeline">
  <link rel="icon" href="assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sheet { display: grid; grid-template-columns: repeat(3, 65mm); grid-auto-rows: 65mm; width: 195mm; margin: 0 auto; page-break-after: always; }
    .pcard { border: 0.3mm dashed #999; display: grid; place-items: center; text-align: center; padding: 4mm; color: #111; background: #fff; }
    .pcard .qr { width: 42mm; height: 42mm; }
    .pcard .qr svg { width: 100%; height: 100%; }
    .pcard small { font-size: 8pt; letter-spacing: .1em; text-transform: uppercase; }
    .pcard .year { font-size: 30pt; font-weight: 700; line-height: 1; }
    .pcard .title { font-size: 12pt; font-weight: 600; }
    .pcard .kind { font-size: 9pt; color: #555; }
    #sheets { max-width: none; padding: 0; }
    .toolbar { padding: 16px; text-align: center; }
    @media print { header, .toolbar { display: none; } main { padding: 0; max-width: none; } @page { size: A4; margin: 6mm; } }
  </style>
</head>
<body>
  <header><a href="index.html" class="brand">Screen Timeline</a><span>Printable cards</span></header>
  <div class="toolbar">
    <p>Print double-sided (flip on long edge). Odd pages are fronts with QR codes; even pages are backs with the answers.</p>
    <button class="primary" style="width:auto" onclick="print()">Print</button>
  </div>
  <main id="sheets"></main>
  <script type="module" src="js/print.js"></script>
</body>
</html>
